<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>حاسبة جرعات الأدوية والسوائل للأطفال</title>
    <style>
        /* التوافق التلقائي مع ثيم النظام (فاتح أو داكن افتراضياً) */
        :root {
            color-scheme: light dark;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --border-color: #cbd5e1;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --primary-btn: #0d9488;
            --primary-btn-hover: #0f766e;
            --reset-btn: #ea580c;
            --reset-btn-hover: #c2410c;
            --copy-btn: #0284c7;
            --copy-btn-hover: #0369a1;
            --accent-color: #0284c7;
            --input-bg: #f1f5f9;
            --fluid-bg: #f1f5f9;
        }

        /* الثيم الداكن الافتراضي عند استخدام النظام للوضع الليلي */
        @media (prefers-color-scheme: dark) {
            :root:not([data-theme="light"]) {
                --bg-color: #12141c;
                --card-bg: #1a1d26;
                --border-color: #2d323f;
                --text-main: #f1f5f9;
                --text-muted: #94a3b8;
                --primary-btn: #0f766e;
                --primary-btn-hover: #115e59;
                --reset-btn: #c2410c;
                --reset-btn-hover: #9a3412;
                --copy-btn: #0284c7;
                --copy-btn-hover: #0369a1;
                --accent-color: #38bdf8;
                --input-bg: #12141c;
                --fluid-bg: #1e222d;
            }
        }

        /* الفرض اليدوي للوضع الفاتح عبر الزر */
        [data-theme="light"] {
            color-scheme: light;
            --bg-color: #f8fafc !important;
            --card-bg: #ffffff !important;
            --border-color: #cbd5e1 !important;
            --text-main: #0f172a !important;
            --text-muted: #64748b !important;
            --primary-btn: #0d9488 !important;
            --primary-btn-hover: #0f766e !important;
            --reset-btn: #ea580c !important;
            --reset-btn-hover: #c2410c !important;
            --copy-btn: #0284c7 !important;
            --copy-btn-hover: #0369a1 !important;
            --accent-color: #0284c7 !important;
            --input-bg: #f1f5f9 !important;
            --fluid-bg: #f1f5f9 !important;
        }

        /* الفرض اليدوي للوضع الداكن عبر الزر */
        [data-theme="dark"] {
            color-scheme: dark;
            --bg-color: #12141c !important;
            --card-bg: #1a1d26 !important;
            --border-color: #2d323f !important;
            --text-main: #f1f5f9 !important;
            --text-muted: #94a3b8 !important;
            --primary-btn: #0f766e !important;
            --primary-btn-hover: #115e59 !important;
            --reset-btn: #c2410c !important;
            --reset-btn-hover: #9a3412 !important;
            --copy-btn: #0284c7 !important;
            --copy-btn-hover: #0369a1 !important;
            --accent-color: #38bdf8 !important;
            --input-bg: #12141c !important;
            --fluid-bg: #1e222d !important;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 15px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            transition: background-color 0.3s ease, color 0.3s ease;
        }
        .container {
            width: 100%;
            max-width: 480px;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 25px;
            border-radius: 20px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.15);
            box-sizing: border-box;
            transition: background-color 0.3s ease, border-color 0.3s ease;
        }
        
        .header-flex {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            direction: ltr;
        }
        .en-header h2 {
            margin: 0;
            font-size: 20px;
            color: var(--text-main);
        }
        .subtitle {
            color: var(--text-muted);
            font-size: 13px;
            margin-top: 5px;
            text-align: left;
            direction: ltr;
        }
        .theme-toggle {
            background: var(--input-bg);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 8px 12px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            transition: all 0.2s;
            white-space: nowrap;
        }
        .theme-toggle:hover {
            border-color: var(--accent-color);
        }

        .form-group {
            margin-bottom: 20px;
            text-align: left;
            direction: ltr;
        }
        label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
            font-size: 14px;
            color: var(--text-main);
        }
        input, select {
            width: 100%;
            padding: 12px 15px;
            background-color: var(--input-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            font-size: 15px;
            color: var(--text-main);
            box-sizing: border-box;
            transition: border-color 0.2s, background-color 0.3s, color 0.3s;
            text-align: left;
            direction: ltr;
        }
        input:focus, select:focus {
            outline: none;
            border-color: var(--accent-color);
        }
        
        select option {
            direction: ltr;
            text-align: left;
            background-color: var(--card-bg);
            color: var(--text-main);
            padding: 10px;
        }

        .concentration-box {
            display: none;
            margin-top: 10px;
            padding: 10px;
            background: var(--fluid-bg);
            border-radius: 10px;
            border: 1px dashed var(--border-color);
        }

        .btn-calculate {
            width: 100%;
            background-color: var(--primary-btn);
            color: white;
            border: none;
            padding: 14px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 12px;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
            margin-top: 5px;
            box-shadow: 0 4px 12px rgba(15, 118, 110, 0.3);
            direction: ltr;
        }
        .btn-calculate:hover {
            background-color: var(--primary-btn-hover);
        }
        .btn-calculate:active {
            transform: scale(0.98);
        }
        .btn-reset {
            width: 100%;
            background-color: var(--reset-btn);
            color: white;
            border: none;
            padding: 12px;
            font-size: 15px;
            font-weight: bold;
            border-radius: 12px;
            cursor: pointer;
            transition: background-color 0.2s;
            margin-top: 10px;
            direction: ltr;
        }
        .btn-reset:hover {
            background-color: var(--reset-btn-hover);
        }
        .result-card {
            margin-top: 25px;
            background: var(--input-bg);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            padding: 18px;
            display: none;
            text-align: left;
            direction: ltr;
            position: relative;
            opacity: 0;
            transform: translateY(15px);
            transition: opacity 0.4s ease, transform 0.4s ease, background-color 0.3s;
        }
        .result-card.show {
            display: block;
            opacity: 1;
            transform: translateY(0);
        }
        .result-card h3 {
            margin-top: 0;
            color: var(--accent-color);
            font-size: 16px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 8px;
        }
        .result-item {
            margin-bottom: 10px;
            font-size: 14px;
            color: var(--text-muted);
        }
        .result-item span {
            color: var(--text-main);
            font-weight: bold;
        }
        .highlight-value {
            color: #34d399;
            font-size: 17px;
            font-weight: bold;
        }
        .fluid-details {
            background: var(--fluid-bg);
            padding: 10px;
            border-radius: 8px;
            margin-top: 8px;
            font-size: 13px;
            color: var(--text-main);
            line-height: 1.6;
            direction: ltr;
            text-align: left;
        }
        .btn-copy {
            width: 100%;
            background-color: var(--copy-btn);
            color: white;
            border: none;
            padding: 10px;
            font-size: 14px;
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
            transition: background-color 0.2s;
            margin-top: 15px;
            direction: ltr;
        }
        .btn-copy:hover {
            background-color: var(--copy-btn-hover);
        }
        .footer-signature {
            text-align: center;
            margin-top: 20px;
            font-size: 12px;
            color: var(--text-muted);
            direction: ltr;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header-flex">
        <div class="en-header">
            <h2>Patient & Drug Information</h2>
        </div>
        <button class="theme-toggle" onclick="toggleTheme()" id="themeBtn">☀️ Light</button>
    </div>
    <div class="subtitle" style="margin-bottom: 25px;">Enter patient details and select a drug from the list.</div>
    
    <div class="form-group">
        <label for="weight">Weight (kg)</label>
        <input type="number" id="weight" placeholder="e.g. 12.5" min="0.5" max="150" step="0.1">
    </div>

    <div class="form-group">
        <label for="ageMonthsInput">Age (Months)</label>
        <input type="number" id="ageMonthsInput" placeholder="Months (e.g. 3)" min="0" max="240">
    </div>

    <div class="form-group">
        <label for="medication">Select a drug / service</label>
        <select id="medication" onchange="checkDynamicOptions()">
            <option value="" disabled selected>Choose a medication from the list...</option>
            <option value="fluids">💧 Maintenance Fluids + Electrolytes (Full)</option>
            <option value="half_fluids">💧 Half-Maintenance Fluids (نصف الحاجة)</option>
            <optgroup label="--- IV Medications ---">
                <option value="iv_0">نقل الدم / البلازما</option>
                <option value="iv_1">ألبومين 20%</option>
                <option value="iv_2">كلوريد البوتاسيوم 7.5%</option>
                <option value="iv_3">كلوريد البوتاسيوم 15%</option>
                <option value="iv_4">روس (Ceftriaxone)</option>
                <option value="iv_5">فلاجيل (Metronidazole)</option>
                <option value="iv_6">سيتامول (Paracetamol IV)</option>
                <option value="iv_7">سفتا (Ceftazidime)</option>
                <option value="iv_8">فانكو (Vancomycin)</option>
                <option value="iv_9">كلافو (Claforan)</option>
                <option value="iv_10">روس بلس (Ceftriaxone + Sulbactam)</option>
                <option value="iv_11">أميكا (Amikacin)</option>
                <option value="iv_12">تينام (Tienam)</option>
                <option value="iv_13">ميتوكال (Metoclopramide)</option>
                <option value="iv_14">ديفوميت (Ondansetron)</option>
                <option value="iv_15">ديكلون (Diclofenac)</option>
                <option value="iv_16">ديكسون (Dexamethasone)</option>
                <option value="iv_17">هيدروكورتيزون (Hydrocortisone)</option>
                <option value="iv_18">رايسك (Omeprazole IV)</option>
                <option value="iv_19">سباسمون</option>
                <option value="iv_20">بيتدين</option>
                <option value="iv_21">دورميكوم / دورميتا</option>
                <option value="iv_22">أوغمنتين IV</option>
                <option value="iv_23">سيفيكس / اورالوكس (IV)</option>
                <option value="iv_24">بروفين (Ibuprofen IV)</option>
                <option value="iv_25">رونيم (Meropenem)</option>
                <option value="iv_26">تارغو (Targocid)</option>
                <option value="iv_27">بيزا (Piperacillin/Tazobactam)</option>
                <option value="iv_28">كوليستين</option>
                <option value="iv_29">فلوكونازول</option>
                <option value="iv_30">ليفوفلوكساسين</option>
                <option value="iv_31">لينزولايد</option>
            </optgroup>
            <optgroup label="--- Oral Syrups ---">
                <option value="oral_0">نتروفورانتوئين</option>
                <option value="oral_1">لاكتولوز</option>
                <option value="oral_2">سيفيكس (Oral)</option>
                <option value="oral_3">اورالوكس (Oral)</option>
                <option value="oral_4">فلاجيل (Metronidazole Oral)</option>
                <option value="oral_5">سيتامول (Paracetamol Syrup)</option>
                <option value="oral_6">بروفين (Ibuprofen Syrup)</option>
                <option value="oral_7">أوغمنتين (Augmentin Syrup)</option>
                <option value="oral_8">أومني (Omnicef)</option>
                <option value="oral_9">زدناد (Zinnat)</option>
            </optgroup>
        </select>

        <div id="concentrationBox" class="concentration-box">
            <label for="subOptionSelect" id="subOptionLabel">اختر الجرعة أو التركيز:</label>
            <select id="subOptionSelect"></select>
        </div>
    </div>

    <button class="btn-calculate" onclick="calculate()">Calculate Dose</button>
    <button class="btn-reset" onclick="resetForm()">Reset</button>

    <div id="resultCard" class="result-card">
        <h3 id="resTitle">Calculation Result</h3>
        <div class="result-item">Item: <span id="resName">-</span></div>
        <div class="result-item" id="rowMg">Calculated Dose: <span id="resMg">-</span></div>
        <div class="result-item" id="rowMl">Volume / Details: <span id="resMl" class="highlight-value">-</span></div>
        <div class="result-item" id="rowDoseText">Recommended Dose: <span id="resDoseText">-</span></div>
        <div class="result-item" id="rowFreq">Frequency: <span id="resFreq">-</span></div>
        <div class="result-item" id="rowMax">Max / Notes: <span id="resMax">-</span></div>
        
        <button class="btn-copy" onclick="copyResultToClipboard()">📋 Copy Result</button>
    </div>

    <div class="footer-signature">
        Developed by Dr. Thaer Alhussein
    </div>
</div>

<script>
    const html = document.documentElement;
    const themeBtn = document.getElementById('themeBtn');

    // تحديث شكل زر الثيم بناءً على الوضع الحالي
    function updateButtonText() {
        const isLight = html.getAttribute('data-theme') === 'light' || (!html.getAttribute('data-theme') && window.matchMedia('(prefers-color-scheme: light)').matches);
        themeBtn.textContent = isLight ? '🌙 Dark' : '☀️ Light';
    }

    // تطبيق الثيم المحفوظ يدويًا إن وجد
    const savedTheme = localStorage.getItem('theme_manual');
    if (savedTheme) {
        html.setAttribute('data-theme', savedTheme);
    }
    updateButtonText();

    // تبديل الثيم يدوياً وحفظ الاختيار
    function toggleTheme() {
        const currentTheme = html.getAttribute('data-theme');
        let newTheme = '';
        
        if (currentTheme === 'light') {
            newTheme = 'dark';
        } else if (currentTheme === 'dark') {
            newTheme = 'light';
        } else {
            // إذا كان على وضع النظام، اعكس الوضع الحالي للجهاز
            const isSystemDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
            newTheme = isSystemDark ? 'light' : 'dark';
        }

        html.setAttribute('data-theme', newTheme);
        localStorage.setItem('theme_manual', newTheme);
        updateButtonText();
    }

    // الاستماع لتغييرات نظام الجهاز في حال لم يحدد المستخدم وضعاً يددوياً
    window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => {
        if (!localStorage.getItem('theme_manual')) {
            updateButtonText();
        }
    });

    const ivMeds = [
        { name: "نقل الدم / البلازما", doseText: "10-15 ml/kg", freq: "Infuse over 3 hours", max: "-", calc: w => `${(w * 10).toFixed(2)} to ${(w * 15).toFixed(2)} ml` },
        { name: "ألبومين 20%", doseText: "1 g/kg", freq: "Infuse over 3 hours", max: "-", calc: w => `${(w * 1).toFixed(2)} g` },
        { name: "كلوريد البوتاسيوم 7.5%", doseText: "1 ml/kg", freq: "-", max: "-", calc: w => `${(w * 1).toFixed(2)} ml` },
        { name: "كلوريد البوتاسيوم 15%", doseText: "0.5 ml/kg", freq: "-", max: "-", calc: w => `${(w * 0.5).toFixed(2)} ml` },
        {
            name: "روس (Ceftriaxone)", 
            doseText: "50 mg/kg/day", 
            freq: "Twice daily (divided BID)", 
            max: "Max 1 g per single dose", 
            calc: w => {
                let total = w * 50;
                let single = total / 2;
                if (single > 1000) { single = 1000; total = 2000; }
                return `Single Dose: ${single.toFixed(2)} mg | Daily Total: ${total.toFixed(2)} mg`;
            }
        },
        {
            name: "فلاجيل (Metronidazole)", 
            doseText: "30 mg/kg/day", 
            freq: "Divided TID (every 8 hours)", 
            max: "Max 500 mg per single dose", 
            calc: w => {
                let total = w * 30;
                let single = total / 3;
                if (single > 500) { single = 500; total = 1500; }
                return `Single Dose: ${single.toFixed(2)} mg | Daily Total: ${total.toFixed(2)} mg`;
            }
        },
        {
            name: "سيتامول (Paracetamol IV)", 
            doseText: "60 mg/kg/day", 
            freq: (optIndex) => (optIndex === 1 ? "6 times daily (Every 4 hours)" : "4 times daily (Every 6 hours)"), 
            max: "Max 1 g per single dose", 
            isSelectableDose: true,
            options: [
                { label: "4 مرات يومياً (مقسومة على 4 جرعات - كل 6 ساعات)", divider: 4 },
                { label: "6 مرات يومياً (مقسومة على 6 جرعات - كل 4 ساعات)", divider: 6 }
            ],
            calc: (w, optIndex) => {
                let total = w * 60;
                let divider = (optIndex === 1) ? 6 : 4;
                let single = total / divider;
                if (single > 1000) { single = 1000; }
                return `Single Dose: ${single.toFixed(2)} mg | Daily Total: ${total.toFixed(2)} mg`;
            }
        },
        {
            name: "سفتا (Ceftazidime)", 
            doseText: "150 mg/kg/day", 
            freq: "Divided TID", 
            max: "Max 1 g per single dose", 
            calc: w => {
                let total = w * 150;
                let single = total / 3;
                if (single > 1000) { single = 1000; total = 3000; }
                return `Single Dose: ${single.toFixed(2)} mg | Daily Total: ${total.toFixed(2)} mg`;
            }
        },
        {
            name: "فانكو (Vancomycin)", 
            doseText: "45 mg/kg/day", 
            freq: "Divided TID", 
            max: "No max limit", 
            calc: w => {
                let total = w * 45;
                let single = total / 3;
                return `Single Dose: ${single.toFixed(2)} mg | Daily Total: ${total.toFixed(2)} mg`;
            }
        },
        {
            name: "كلافو (Claforan)", 
            doseText: "150 mg/kg/day", 
            freq: "Divided TID", 
            max: "Max 12 g daily total", 
            calc: w => {
                let total = w * 150;
                if (total > 12000) total = 12000;
                let single = total / 3;
                return `Single Dose: ${single.toFixed(2)} mg | Daily Total: ${total.toFixed(2)} mg`;
            }
        },
        {
            name: "روس بلس (Ceftriaxone + Sulbactam)", 
            doseText: "75 mg/kg/day", 
            freq: "Divided BID", 
            max: "No max limit", 
            calc: w => {
                let total = w * 75;
                let single = total / 2;
                return `Single Dose: ${single.toFixed(2)} mg | Daily Total: ${total.toFixed(2)} mg`;
            }
        },
        {
            name: "أميكا (Amikacin)", 
            doseText: "15 mg/kg/day", 
            freq: "Divided BID (max 5 days)", 
            max: "Max 1.5 g daily total", 
            calc: w => {
                let total = w * 15;
                if (total > 1500) total = 1500;
                let single = total / 2;
                return `Single Dose: ${single.toFixed(2)} mg | Daily Total: ${total.toFixed(2)} mg`;
            }
        },
        {
            name: "تينام (Tienam)", 
            doseText: "100 mg/kg/day", 
            freq: "Divided TID", 
            max: "Max 500 mg per single dose", 
            calc: w => {
                let total = w * 100;
                let single = total / 3;
                if (single > 500) { single = 500; total = 1500; }
                return `Single Dose: ${single.toFixed(2)} mg | Daily Total: ${total.toFixed(2)} mg`;
            }
        },
        {
            name: "ميتوكال (Metoclopramide)", 
            doseText: "0.45 mg/kg/day", 
            freq: "Divided TID", 
            max: "Max 0.8 mg/kg/day", 
            calc: w => {
                let total = w * 0.45;
                let maxDaily = w * 0.8;
                if (total > maxDaily) total = maxDaily;
                let single = total / 3;
                return `Single Dose: ${single.toFixed(2)} mg | Daily Total: ${total.toFixed(2)} mg`;
            }
        },
        {
            name: "ديفوميت (Ondansetron)", 
            doseText: "0.15 mg/kg", 
            freq: "TID", 
            max: "Max 16 mg per single dose", 
            calc: w => {
                let single = w * 0.15;
                if (single > 16) single = 16;
                return `Single Dose: ${single.toFixed(2)} mg`;
            }
        },
        {
            name: "ديكلون (Diclofenac)", 
            doseText: "1 mg/kg", 
            freq: "TID (3 times daily - IM عضل)", 
            max: "No max limit", 
            calc: w => {
                let single = w * 1;
                let total = single * 3;
                return `Single Dose: ${single.toFixed(2)} mg | Daily Total: ${total.toFixed(2)} mg (عضلي)`;
            }
        },
        {
            name: "ديكسون (Dexamethasone)", 
            doseText: "0.5 mg/kg/day", 
            freq: "Divided TID", 
            max: "Max 10 mg per single dose", 
            calc: w => {
                let total = w * 0.5;
                let single = total / 3;
                if (single > 10) { single = 10; total = 30; }
                return `Single Dose: ${single.toFixed(2)} mg | Daily Total: ${total.toFixed(2)} mg`;
            }
        },
        {
            name: "هيدروكورتيزون (Hydrocortisone)", 
            doseText: "10 mg/kg", 
            freq: "Max twice daily (BID)", 
            max: "Max 100 mg per single dose", 
            calc: w => { 
                let single = w * 10;
                if (single > 100) single = 100;
                let total = single * 2;
                return `Single Dose: ${single.toFixed(2)} mg | Daily Total (Max BID): ${total.toFixed(2)} mg`; 
            }
        },
        { name: "رايسك (Omeprazole IV)", doseText: "1 mg/kg", freq: "-", max: "Max 40 mg", calc: w => { let d = w * 1; return d > 40 ? "40.00 mg" : `${d.toFixed(2)} mg`; } },
        {
            name: "سباسمون", 
            doseText: "0.5 mg/kg", 
            freq: "TID (3 times daily)", 
            max: "-", 
            calc: w => {
                let single = w * 0.5;
                let total = single * 3;
                return `Single Dose: ${single.toFixed(2)} mg | Daily Total: ${total.toFixed(2)} mg`;
            }
        },
        { name: "بيتدين", doseText: "0.5-1 mg/kg", freq: "-", max: "-", calc: w => `${(w * 0.5).toFixed(2)} to ${(w * 1).toFixed(2)} mg` },
        { name: "دورميكوم / دورميتا", doseText: "0.2-0.5 mg/kg", freq: "-", max: "Max 5 mg", calc: w => { let d = w * 0.2; return d > 5 ? "5.00 mg" : `${d.toFixed(2)} mg`; } },
        {
            name: "أوغمنتين IV", 
            doseText: "75 mg/kg/day", 
            freq: "Divided TID", 
            max: "Max 600 mg per single dose", 
            calc: w => {
                let total = w * 75;
                let single = total / 3;
                if (single > 600) { single = 600; total = 1800; }
                return `Single Dose: ${single.toFixed(2)} mg | Daily Total: ${total.toFixed(2)} mg`;
            }
        },
        {
            name: "سيفيكس / اورالوكس (IV)", 
            doseText: "10 mg/kg", 
            freq: "Divided BID", 
            max: "-", 
            calc: w => {
                let total = w * 10;
                let single = total / 2;
                return `Single Dose: ${single.toFixed(2)} mg | Daily Total: ${total.toFixed(2)} mg`;
            }
        },
        {
            name: "بروفين (Ibuprofen IV)", 
            doseText: "8 - 10 mg/kg per dose", 
            freq: "3 times daily (TID)", 
            max: "Max 800 mg/single dose | Max 3,200 mg/day", 
            isSelectableDose: true,
            options: [
                { label: "8 mg / kg per single dose", dose: 8 },
                { label: "10 mg / kg per single dose", dose: 10 }
            ],
            calc: (w, optIndex) => {
                let dosePerKg = (optIndex === 1) ? 10 : 8;
                let single = w * dosePerKg;
                if (single > 800) single = 800;
                let total = single * 3;
                if (total > 3200) total = 3200;
                return `Single Dose: ${single.toFixed(2)} mg | Daily Total: ${total.toFixed(2)} mg (${dosePerKg} mg/kg)`;
            }
        },
        {
            name: "رونيم (Meropenem)", 
            doseText: "60 mg/kg/day", 
            freq: "Divided TID", 
            max: "Max 3 g daily total", 
            calc: w => {
                let total = w * 60;
                if (total > 3000) total = 3000;
                let single = total / 3;
                return `Single Dose: ${single.toFixed(2)} mg | Daily Total: ${total.toFixed(2)} mg`;
            }
        },
        { name: "تارغو (Targocid)", doseText: "Loading 12 / Maintenance 10 mg/kg", freq: "Every 12h then maintenance", max: "-", calc: w => `Loading: ${(w * 12).toFixed(2)} mg | Maint: ${(w * 10).toFixed(2)} mg` },
        {
            name: "بيزا (Piperacillin/Tazobactam)", 
            doseText: "100 mg/kg", 
            freq: "TID", 
            max: "Max 4.5 g per single dose", 
            calc: w => { 
                let single = w * 100;
                if (single > 4500) single = 4500;
                let total = single * 3;
                return `Single Dose: ${single.toFixed(2)} mg | Daily Total: ${total.toFixed(2)} mg`; 
            }
        },
        { name: "كوليستين", doseText: "75,000 IU/kg", freq: "Divided TID", max: "-", calc: w => `${(w * 75000).toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2})} IU` },
        {
            name: "فلوكونازول", 
            doseText: "10 mg/kg/day", 
            freq: "Single dose", 
            max: "Max 12 mg/kg/day", 
            calc: w => { 
                let total = w * 10;
                let maxTotal = w * 12;
                if (total > maxTotal) total = maxTotal;
                return `Daily Dose: ${total.toFixed(2)} mg`; 
            }
        },
        { name: "ليفوفلوكساسين", doseText: "10 mg/kg", freq: "Single dose", max: "Max 500 mg", calc: w => { let d = w * 10; return d > 500 ? "500.00 mg" : `${d.toFixed(2)} mg`; } },
        {
            name: "لينزولايد", 
            doseText: "10 mg/kg", 
            freq: "TID", 
            max: "No max limit", 
            calc: w => {
                let single = w * 10;
                let total = single * 3;
                return `Single Dose: ${single.toFixed(2)} mg | Daily Total: ${total.toFixed(2)} mg`;
            }
        }
    ];

    const oralMeds = [
        { name: "نتروفورانتوئين", doseText: "Therapeutic 5 mg/kg", freq: "Therapeutic", max: "400 mg/day", concentrations: [{ label: "25 mg / 5 ml", mg: 25, ml: 5 }], calcMg: w => w * 5 },
        { 
            name: "لاكتولوز", 
            doseText: "7.5 ml fixed", 
            freq: "1-2 times daily", 
            max: "-", 
            fixedMl: 7.5,
            concentrations: [
                { label: "10g / 15ml", mg: 10, ml: 15 }
            ] 
        },
        { name: "سيفيكس (Oral)", doseText: "10 mg/kg/day", freq: "Divided BID", max: "-", concentrations: [{ label: "100 mg / 5 ml", mg: 100, ml: 5 }], calcMg: w => w * 10 },
        { name: "اورالوكس (Oral)", doseText: "10 mg/kg/day", freq: "Divided BID", max: "-", concentrations: [{ label: "50 mg / 5 ml", mg: 50, ml: 5 }, { label: "100 mg / 5 ml", mg: 100, ml: 5 }], calcMg: w => w * 10 },
        { 
            name: "فلاجيل (Metronidazole Oral)", 
            doseText: "30 mg/kg/day", 
            freq: "Divided TID (every 8 hours)", 
            max: "Max 500 mg per single dose", 
            concentrations: [
                { label: "125 mg / 5 ml", mg: 125, ml: 5 }, 
                { label: "200 mg / 5 ml", mg: 200, ml: 5 }
            ], 
            calcSingleMg: w => { 
                let total = w * 30; 
                let single = total / 3; 
                if (single > 500) single = 500; 
                return single; 
            } 
        },
        {
            name: "سيتامول (Paracetamol Syrup)", 
            doseText: "60 mg/kg/day", 
            freq: "Every 6 hours (4 times daily - QID)", 
            max: "Max 1 g per single dose | Max 4 g/day", 
            concentrations: [
                { label: "120 mg / 5 ml", mg: 120, ml: 5 },
                { label: "160 mg / 5 ml", mg: 160, ml: 5 },
                { label: "200 mg / 5 ml", mg: 200, ml: 5 },
                { label: "250 mg / 5 ml", mg: 250, ml: 5 }
            ],
            calcSingleMg: w => {
                let total = w * 60;
                let single = total / 4;
                if (single > 1000) single = 1000;
                return single;
            }
        },
        {
            name: "بروفين (Ibuprofen Syrup)", 
            doseText: "20 - 30 mg/kg/day (نطاق الجرعة)", 
            rangeDose: { minRate: 20, maxRate: 30 },
            freq: "TID (3 مرات يومياً)", 
            max: "Max 400 mg per single dose", 
            concentrations: [
                { label: "100 mg / 5 ml", mg: 100, ml: 5 },
                { label: "200 mg / 5 ml", mg: 200, ml: 5 }
            ],
            isRange: true
        },
        { 
            name: "أوغمنتين (Augmentin Syrup)", 
            doseText: "25 mg/kg per dose", 
            freq: "Divided TID (3 times daily - every 8 hours)", 
            max: "-", 
            concentrations: [
                { label: "156 mg / 5 ml", mg: 156, ml: 5 }, 
                { label: "228 mg / 5 ml", mg: 228, ml: 5 }, 
                { label: "312 mg / 5 ml", mg: 312, ml: 5 }, 
                { label: "457 mg / 5 ml", mg: 457, ml: 5 }
            ], 
            calcSingleMg: w => w * 25 
        },
        { name: "أومني (Omnicef)", doseText: "7 mg/kg", freq: "BID", max: "-", concentrations: [{ label: "125 mg / 5 ml", mg: 125, ml: 5 }, { label: "250 mg / 5 ml", mg: 250, ml: 5 }], calcMg: w => w * 7 },
        { name: "زدناد (Zinnat)", doseText: "30 mg/kg/day", freq: "Divided BID", max: "-", concentrations: [{ label: "125 mg / 5 ml", mg: 125, ml: 5 }, { label: "250 mg / 5 ml", mg: 250, ml: 5 }], calcMg: w => w * 30 }
    ];

    function checkDynamicOptions() {
        const val = document.getElementById('medication').value;
        const box = document.getElementById('concentrationBox');
        const select = document.getElementById('subOptionSelect');
        const label = document.getElementById('subOptionLabel');
        
        select.innerHTML = '';
        box.style.display = 'none';

        if (val.startsWith('oral_')) {
            const index = parseInt(val.split('_')[1]);
            const med = oralMeds[index];
            if (med.concentrations && med.concentrations.length > 0) {
                label.textContent = "اختر تركيز الشراب:";
                med.concentrations.forEach((c, idx) => {
                    let opt = document.createElement('option');
                    opt.value = idx;
                    opt.textContent = c.label;
                    select.appendChild(opt);
                });
                box.style.display = 'block';
            }
        } else if (val.startsWith('iv_')) {
            const index = parseInt(val.split('_')[1]);
            const med = ivMeds[index];
            if (med.isSelectableDose && med.options) {
                label.textContent = "اختر الجرعة أو طريقة التقسيم:";
                med.options.forEach((o, idx) => {
                    let opt = document.createElement('option');
                    opt.value = idx;
                    opt.textContent = o.label;
                    select.appendChild(opt);
                });
                box.style.display = 'block';
            }
        }
    }

    function calculate() {
        const weightInput = document.getElementById('weight').value;
        const val = document.getElementById('medication').value;
        const resultCard = document.getElementById('resultCard');

        if (!weightInput || parseFloat(weightInput) <= 0) {
            alert('Please enter a valid patient weight first!');
            return;
        }
        if (!val) {
            alert('Please select a drug or service from the list!');
            return;
        }

        const weight = parseFloat(weightInput);
        
        resultCard.classList.remove('show');
        void resultCard.offsetWidth;
        resultCard.classList.add('show');

        let rowMg = document.getElementById('rowMg');
        let rowMl = document.getElementById('rowMl');
        let rowDoseText = document.getElementById('rowDoseText');
        let rowFreq = document.getElementById('rowFreq');
        let rowMax = document.getElementById('rowMax');

        if (val === 'fluids' || val === 'half_fluids') {
            const totalMonths = parseInt(document.getElementById('ageMonthsInput').value) || 0;
            let totalFluid = 0;
            let ruleText = "";

            if (totalMonths > 0 && totalMonths < 6) {
                let rate = 100;
                if (totalMonths === 1) rate = 150;
                else if (totalMonths === 2) rate = 140;
                else if (totalMonths === 3) rate = 130;
                else if (totalMonths === 4) rate = 120;
                else if (totalMonths === 5) rate = 110;
                
                totalFluid = weight * rate;
                ruleText = `Age ${totalMonths} months (${rate} ml/kg)`;
            } else {
                if (weight <= 10) {
                    totalFluid = weight * 100;
                    ruleText = "First 10 kg (100 ml/kg)";
                } else if (weight <= 20) {
                    totalFluid = 1000 + ((weight - 10) * 50);
                    ruleText = "10-20 kg (1000 ml + 50 ml per kg > 10)";
                } else if (weight <= 40) {
                    totalFluid = 1500 + ((weight - 20) * 25);
                    ruleText = "20-40 kg (1500 ml + 25 ml per kg > 20)";
                } else {
                    totalFluid = 2000;
                    ruleText = "Over 40 kg (Max 2 L / day)";
                }
            }

            let isHalf = (val === 'half_fluids');
            if (isHalf) {
                totalFluid = totalFluid / 2;
                ruleText += " (Half-Maintenance / نصف الحاجة)";
            }

            document.getElementById('resTitle').textContent = isHalf ? "Half-Maintenance Fluids & Electrolytes" : "Maintenance Fluids & Electrolytes";
            document.getElementById('resName').textContent = isHalf ? "Half-Maintenance Fluids" : "Maintenance Fluids";

            if (isHalf && weight > 40) {
                document.getElementById('resMl').innerHTML = `Total Fluids: <b>1,000.00 ml / day (1 Liter)</b>`;
            } else if (!isHalf && weight > 40) {
                document.getElementById('resMl').innerHTML = `Total Fluids: <b>2,000.00 ml / day</b>`;
            } else {
                let effectiveWeight = isHalf ? (weight > 40 ? 40 : weight) : weight;
                let ns = totalFluid / 9;
                let ds = ns * 2;
                let kcl = effectiveWeight / (isHalf ? 12 : 6);

                document.getElementById('resMl').innerHTML = `
                    Total Fluids: <b>${totalFluid.toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2})} ml / day</b>
                    <div class="fluid-details">
                        • <b>NS (Normal Saline):</b> ${ns.toFixed(2)} ml<br>
                        • <b>Ds (Dextrose):</b> ${ds.toFixed(2)} ml<br>
                        • <b>KCL:</b> ${kcl.toFixed(2)} ml
                    </div>
                `;
            }
            
            document.getElementById('resDoseText').textContent = ruleText;
            document.getElementById('resFreq').textContent = "Calculated based on standard fluid rules";
            document.getElementById('resMax').textContent = (isHalf && weight > 40) ? "Adult Half-Maintenance Rule: 1 Liter mixed fluids + 1 amp KCL" : (isHalf ? "Half maintenance fluids rate (divided components)" : (weight > 40 ? "Adult Maintenance (2 L / day + 1 amp KCL per liter)" : "Standard max 2 Liters daily"));

            rowMg.style.display = 'none';
            rowMl.style.display = 'block';
            rowDoseText.style.display = 'block';
            rowFreq.style.display = 'block';
            rowMax.style.display = 'block';

        } else if (val.startsWith('iv_')) {
            const index = parseInt(val.split('_')[1]);
            const med = ivMeds[index];

            document.getElementById('resTitle').textContent = "IV Medication Result";
            document.getElementById('resName').textContent = med.name;
            
            let selectedOptIndex = document.getElementById('subOptionSelect').value;
            selectedOptIndex = selectedOptIndex ? parseInt(selectedOptIndex) : 0;

            document.getElementById('resMg').textContent = med.calc(weight, selectedOptIndex);
            document.getElementById('resDoseText').textContent = med.doseText;
            
            if (typeof med.freq === 'function') {
                document.getElementById('resFreq').textContent = med.freq(selectedOptIndex);
            } else {
                document.getElementById('resFreq').textContent = med.freq;
            }
            
            document.getElementById('resMax').textContent = med.max;

            rowMg.style.display = 'block';
            rowMl.style.display = 'none';
            rowDoseText.style.display = 'block';
            rowFreq.style.display = 'block';
            rowMax.style.display = 'block';

        } else if (val.startsWith('oral_')) {
            const index = parseInt(val.split('_')[1]);
            const med = oralMeds[index];

            document.getElementById('resTitle').textContent = "Oral Syrup Result";
            document.getElementById('resName').textContent = med.name;
            document.getElementById('resDoseText').textContent = med.doseText;
            document.getElementById('resFreq').textContent = med.freq;
            document.getElementById('resMax').textContent = med.max;

            rowMg.style.display = 'block';
            rowMl.style.display = 'block';

            if (med.name.includes("لاكتولوز")) {
                document.getElementById('resMg').textContent = 'Laxative Dose (Lactulose 10g/15ml)';
                document.getElementById('resMl').textContent = '7.50 ml (Standard starting dose)';
            } else if (med.name.includes("فلاجيل") || med.name.includes("سيتامول (Paracetamol Syrup)") || med.name.includes("أوغمنتين (Augmentin Syrup)")) {
                let singleMg = med.calcSingleMg(weight);
                let concIndex = document.getElementById('subOptionSelect').value;
                concIndex = concIndex ? parseInt(concIndex) : 0;
                let selectedConc = med.concentrations[concIndex];
                let singleMl = (singleMg * selectedConc.ml) / selectedConc.mg;

                document.getElementById('resMg').textContent = `Single Dose: ${singleMg.toFixed(2)} mg`;
                document.getElementById('resMl').textContent = `${singleMl.toFixed(2)} ml per single dose (${selectedConc.label})`;
            } else if (med.isRange) {
                let minDailyMg = weight * med.rangeDose.minRate;
                let maxDailyMg = weight * med.rangeDose.maxRate;
                let freqDiv = med.name.includes("بروفين") ? 3 : 4; 
                let minSingleMg = minDailyMg / freqDiv;
                let maxSingleMg = maxDailyMg / freqDiv;

                let concIndex = document.getElementById('subOptionSelect').value;
                concIndex = concIndex ? parseInt(concIndex) : 0;
                let selectedConc = med.concentrations[concIndex];

                let minMl = (minSingleMg * selectedConc.ml) / selectedConc.mg;
                let maxMl = (maxSingleMg * selectedConc.ml) / selectedConc.mg;

                document.getElementById('resMg').textContent = `Single Dose Range: ${minSingleMg.toFixed(2)} mg - ${maxSingleMg.toFixed(2)} mg`;
                document.getElementById('resMl').innerHTML = `
                    <b>${minMl.toFixed(2)} ml</b> to <b>${maxMl.toFixed(2)} ml</b> per single dose
                    <div class="fluid-details">
                        • <b>التركيز المختار:</b> ${selectedConc.label}<br>
                        • <b>الجرعة اليومية الإجمالية:</b> ${minDailyMg.toFixed(2)} - ${maxDailyMg.toFixed(2)} mg
                    </div>
                `;
            } else if (med.name.includes("سيفيكس") || med.name.includes("اورالوكس")) {
                let totalMg = med.calcMg(weight);
                let singleMg = totalMg / 2;
                let concIndex = document.getElementById('subOptionSelect').value;
                concIndex = concIndex ? parseInt(concIndex) : 0;
                let selectedConc = med.concentrations[concIndex];
                let singleMl = (singleMg * selectedConc.ml) / selectedConc.mg;
                
                document.getElementById('resMg').textContent = `Single Dose: ${singleMg.toFixed(2)} mg | Daily: ${totalMg.toFixed(2)} mg`;
                document.getElementById('resMl').textContent = `${singleMl.toFixed(2)} ml per single dose (${selectedConc.label})`;
            } else {
                let mg = med.calcMg(weight);
                let concIndex = document.getElementById('subOptionSelect').value;
                concIndex = concIndex ? parseInt(concIndex) : 0;
                let selectedConc = med.concentrations ? med.concentrations[concIndex] : { mg: 25, ml: 5, label: "Default" };
                let ml = (mg * selectedConc.ml) / selectedConc.mg;

                document.getElementById('resMg').textContent = `${mg.toFixed(2)} mg`;
                document.getElementById('resMl').textContent = `${ml.toFixed(2)} ml (Volume) [التركيز: ${selectedConc.label}]`;
            }

            rowDoseText.style.display = 'block';
            rowFreq.style.display = 'block';
            rowMax.style.display = 'block';
        }
    }

    function copyResultToClipboard() {
        const title = document.getElementById('resTitle').innerText;
        const name = document.getElementById('resName').innerText;
        const dose = document.getElementById('rowMg').style.display !== 'none' ? document.getElementById('resMg').innerText : '';
        const volumeEl = document.getElementById('resMl');
        const volume = document.getElementById('rowMl').style.display !== 'none' ? volumeEl.innerText || volumeEl.textContent : '';
        const recDose = document.getElementById('resDoseText').innerText;
        const freq = document.getElementById('resFreq').innerText;
        const max = document.getElementById('resMax').innerText;

        let textToCopy = `--- ${title} ---\nItem: ${name}\n`;
        if (dose) textToCopy += `Dose: ${dose}\n`;
        if (volume) textToCopy += `Details: ${volume.trim()}\n`;
        textToCopy += `Rec. Dose: ${recDose}\nFrequency: ${freq}\nMax/Notes: ${max}`;

        if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(textToCopy).then(() => {
                showCopySuccess();
            }).catch(() => {
                fallbackCopy(textToCopy);
            });
        } else {
            fallbackCopy(textToCopy);
        }
    }

    function fallbackCopy(text) {
        const textarea = document.createElement("textarea");
        textarea.value = text;
        textarea.style.position = "fixed";
        document.body.appendChild(textarea);
        textarea.focus();
        textarea.select();
        try {
            document.execCommand('copy');
            showCopySuccess();
        } catch (err) {
            alert('فشل نسخ النص، يرجى نسخه يدويُا.');
        }
        document.body.removeChild(textarea);
    }

    function showCopySuccess() {
        const copyBtn = document.querySelector('.btn-copy');
        copyBtn.textContent = '✅ Copied Successfully!';
        setTimeout(() => {
            copyBtn.textContent = '📋 Copy Result';
        }, 2000);
    }

    function resetForm() {
        document.getElementById('weight').value = '';
        document.getElementById('ageMonthsInput').value = '';
        document.getElementById('medication').selectedIndex = 0;
        document.getElementById('concentrationBox').style.display = 'none';
        const resultCard = document.getElementById('resultCard');
        resultCard.classList.remove('show');
        setTimeout(() => {
            resultCard.style.display = 'none';
        }, 300);
    }
</script>
